function localLog(k,r){var a=get(k,[]);a.push(r);return put(k,a)}function issues(){var points=['GENERAL OPERATIONAL ISSUE'];Object.keys(DATA).forEach(function(k){DATA[k].forEach(function(t){if(points.indexOf(t.name)<0)points.push(t.name)})});points.push('OTHER ISSUE');var h=head()+'<section><label>RELATED CHECKLIST POINT</label><select id="point" onchange="$(\'other\').style.display=this.value===\'OTHER ISSUE\'?\'block\':\'none\'">'+opts(points)+'</select><input id="other" style="display:none" placeholder="SPECIFY OTHER ISSUE"><label>ISSUE DESCRIPTION</label><textarea id="desc"></textarea><button class="full" onclick="addIssue()">+ ADD ISSUE</button></section>';var a=get('jblChecklistIssuesV2',[]);['ACTIVE ISSUES','RESOLVED HISTORY'].forEach(function(group){h+='<section><h3>'+group+'</h3>';a.forEach(function(r,i){if((r.status==='Resolved')!==(group==='RESOLVED HISTORY'))return;h+='<div class="card"><b>'+esc(r.point)+'</b><p>'+esc(r.description)+'</p><p>'+esc(r.status)+'</p>';if(r.status!=='Resolved')h+='<select id="is'+i+'">'+opts(['Pending','In Progress','Resolved'],r.status)+'</select><textarea id="in'+i+'" placeholder="ACTION TAKEN / RESOLUTION REMARKS"></textarea><button onclick="updateIssue('+i+')">UPDATE ISSUE STATUS</button>';else h+='<p>'+esc(JSON.stringify(r.history||[]))+'</p>';h+='</div>'});h+='</section>'});$('app').innerHTML=h+'<button class="full" onclick="menu()">BACK TO MENU</button>'}function addIssue(){var p=$('point').value,d=$('desc').value.trim();if(p==='OTHER ISSUE')p=$('other').value.trim();if(!p||!d)return alert('COMPLETE ISSUE DETAILS');if(localLog('jblChecklistIssuesV2',{id:uid(),point:p,description:d,status:'Pending',reportedBy:ctx.name,reportedCode:ctx.code,reportedShift:ctx.shift,reportedAt:stamp(),history:[]}))issues()}function updateIssue(i){var a=get('jblChecklistIssuesV2',[]),n=$('in'+i).value.trim();if(!n)return alert('ACTION REMARKS REQUIRED');a[i].status=$('is'+i).value;a[i].history=a[i].history||[];a[i].history.push({status:a[i].
